name: build-apk

on:
  workflow_dispatch:          # 手动出包：Actions 页 -> Run workflow
  push:
    paths:
      - 'android/**'
      - 'core/**'
      - 'gradle/**'
      - '*.gradle.kts'
      - '.github/workflows/build-apk.yml'

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run core logic + 60Hz perf tests
        run: |
          chmod +x gradlew
          ./gradlew :core:test --no-daemon --stacktrace --console=plain 2>&1 | tee /tmp/core-test.log
          exit ${PIPESTATUS[0]}

      - name: Surface test failures as annotations
        if: failure()
        run: |
          python3 - <<'EOF'
          import glob, xml.etree.ElementTree as ET
          found = False
          for p in glob.glob('**/test-results/**/*.xml', recursive=True):
              r = ET.parse(p).getroot()
              for tc in r.iter('testcase'):
                  for f in list(tc.iter('failure')) + list(tc.iter('error')):
                      found = True
                      msg = (f.get('message') or 'test failed').replace('\n', ' ')[:400]
                      print(f"::error file={tc.get('classname')},title={tc.get('name')}::{msg}")
          if not found:
              # 编译/配置失败：回传 gradle 日志尾部
              try:
                  tail = open('/tmp/core-test.log', 'rb').read()[-5000:].decode('utf-8', 'replace')
              except OSError:
                  tail = '(no log captured)'
              for line in tail.splitlines():
                  line = line.strip()
                  if line:
                      print('::error::' + line[:300])
          EOF

      - name: Build debug APK
        run: |
          ./gradlew :android:assembleDebug --no-daemon --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: android/build/outputs/apk/debug/android-debug.apk
          if-no-files-found: error

      # ---- Release（可选）：在仓库 Secrets 配置以下四项后启用 ----
      # KEYSTORE_BASE64 / KEYSTORE_PASSWORD / KEY_ALIAS / KEY_PASSWORD
